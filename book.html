<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book — Jāmiʿah Islāmiyah Abū Bakr</title>
  <meta name="color-scheme" content="light dark">

  <!-- Light or dark before first paint: the viewer's last choice, else the
       system setting. nav.js owns the toggle; keep the key in step with it. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("alimiyyah.theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="icon" href="assets/img/logo_gold_web.png">
  <link rel="stylesheet" href="assets/fonts/fonts.css?v=1">
  <link rel="stylesheet" href="assets/css/styles.css?v=129">
</head>
<body id="top" class="on-ground">

<a class="skip-link" href="#main">Skip to content</a>

<!-- ============================== HEADER ============================== -->
<!-- As on the home page: a round menu button, and the light/dark toggle
     beside an outline pill. There is no banner here, so they sit on the
     ground (.on-ground: cream rounds in light). -->
<header class="site-header">
  <div class="wrap site-header__inner">
    <button class="round" type="button" data-menu-open aria-controls="site-menu" aria-expanded="false" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="site-header__end">
      <button class="round theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
        <svg class="theme-toggle__moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="theme-toggle__sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="btn btn--line btn--sm site-header__cta" href="index.html#curriculum">View Curriculum</a>
    </div>
  </div>
</header>

<!-- The menu: the site's links over the whole screen, opened from the round button. -->
<nav class="menu" id="site-menu" aria-label="Primary">
  <button class="round menu__close" type="button" data-menu-close aria-label="Close menu">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <ul class="menu__list">
    <li><a href="index.html#top">Home</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#program">Program</a></li>
    <li><a href="index.html#teachers">Teachers</a></li>
    <li><a href="bookstore.html">Bookstore</a></li>
    <li><a href="index.html#articles">Articles</a></li>
    <li><a href="index.html#videos">Videos</a></li>
    <li><a href="index.html#alumni">Alumni</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<main id="main">
  <!-- =========================== THE BOOK ============================ -->
  <!-- book.js fills every slot from content/bookstore.json, finding the
       book by the ?id= in the address: its bookstore leaf opened into the
       head of the page, the cover beside its colophon, the price, the way
       to reserve it (Add to cart: cart.js's slip sends the reservation)
       and how it is collected. Nothing here takes a payment. -->
  <section class="b-head wrap">
    <div class="b-leaf">
      <div class="b-leaf__cover" data-slot="book-cover"></div>
      <div class="b-leaf__body">
        <a class="back" href="bookstore.html"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"/></svg> Bookstore</a>
        <p class="b-leaf__subject" data-slot="book-subject"></p>
        <h1 class="b-leaf__title" data-slot="book-title"></h1>
        <p class="b-leaf__edition" data-slot="book-edition"></p>
        <p class="b-leaf__category" data-slot="book-category"></p>
        <p class="b-leaf__desc" data-slot="book-description"></p>
        <div class="b-leaf__prints" data-slot="book-prints"></div>
        <p class="b-leaf__price" data-slot="book-price"></p>
        <div class="b-leaf__buy" data-slot="book-buy"></div>
        <p class="b-leaf__pickup" data-slot="book-pickup"></p>
        <span class="store-card__dots" aria-hidden="true"></span>
      </div>
    </div>
  </section>
</main>

<!-- ============================== FOOTER ============================== -->
<footer class="site-footer" id="contact">
  <div class="wrap">
    <div class="site-footer__grid">
      <a class="brand brand--footer" href="index.html">
        <img class="brand__mark" src="assets/img/logo_gold_web.png" alt="" width="80" height="58">
        <span class="brand__name">Jāmiʿah Islāmiyah Abū Bakr</span>
      </a>
      <div>
        <h2 class="site-footer__heading">Contact</h2>
        <address class="site-footer__contact" data-slot="footer-contact"></address>
      </div>
    </div>
    <p class="site-footer__legal">&copy; <span data-slot="year"></span> Jāmiʿah Islāmiyah Abū Bakr</p>
  </div>
</footer>

<script src="assets/js/nav.js?v=5"></script>
<script src="assets/js/cart.js?v=3"></script>
<script src="assets/js/curriculum.js?v=20"></script>
<script src="assets/js/book.js?v=7"></script>
</body>
</html>
