<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold Text Preview (round 1)</title>
  <link rel="icon" href="../../assets/img/logo.png">
  <style>
    html, body { margin: 0; height: 100%; background: #faf8f3; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .switch { position: fixed; right: 16px; bottom: 16px; z-index: 9; display: flex; gap: 4px; padding: 5px; border-radius: 999px;
      background: rgba(40, 26, 12, 0.88); box-shadow: 0 10px 30px -8px rgba(0,0,0,.5); font: 600 13px system-ui, sans-serif; }
    .switch a { padding: 7px 13px; border-radius: 999px; color: #f3e6c8; text-decoration: none; white-space: nowrap; }
    .switch a[aria-current="true"] { background: #e2c57e; color: #2a1a0b; }
  </style>
</head>
<body>
  <iframe title="Site preview"></iframe>
  <nav class="switch" aria-label="Theme"></nav>
  <script src="golds.js"></script>
  <script>
    var n = Number(new URLSearchParams(location.search).get("t")) || 0;
    var sw = document.querySelector(".switch");
    [{ n: 0, name: "Wood only" }].concat(GOLDS).forEach(function (t) {
      var a = document.createElement("a");
      a.href = "?t=" + t.n;
      a.textContent = t.n ? t.n + " · " + t.name : t.name;
      if (t.n === n) a.setAttribute("aria-current", "true");
      sw.appendChild(a);
    });
    goldFrame(document.querySelector("iframe"), n);
  </script>
</body>
</html>
