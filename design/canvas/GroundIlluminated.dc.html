<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600;1,700&family=EB+Garamond:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c9a961; }
    a:hover { color: #d9be78; }
  </style>
</helmet>

<div style="width: 1180px; min-height: 740px; padding: 40px; box-sizing: border-box; background: #fbf7ee; font-family: 'EB Garamond', Garamond, 'Times New Roman', serif; position: relative;">
  <div style="position: absolute; inset: 16px; border: 1.5px solid #c9a961; pointer-events: none;"></div>
  <div style="position: absolute; inset: 22px; border: 1px solid rgba(201, 169, 97, 0.6); pointer-events: none;"></div>
  <svg style="position: absolute; top: 10px; left: 10px;" width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><polygon points="6.5,0 13,6.5 6.5,13 0,6.5" fill="#c9a961"></polygon></svg>
  <svg style="position: absolute; top: 10px; right: 10px;" width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><polygon points="6.5,0 13,6.5 6.5,13 0,6.5" fill="#c9a961"></polygon></svg>
  <svg style="position: absolute; bottom: 10px; left: 10px;" width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><polygon points="6.5,0 13,6.5 6.5,13 0,6.5" fill="#c9a961"></polygon></svg>
  <svg style="position: absolute; bottom: 10px; right: 10px;" width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><polygon points="6.5,0 13,6.5 6.5,13 0,6.5" fill="#c9a961"></polygon></svg>

  <!-- tail of the curriculum panel (clipped so the gilt rings read as continuing above) -->
  <div style="width: 1100px; height: 150px; overflow: hidden; border-radius: 0 0 18px 18px;">
    <div style="height: 320px; margin-top: -170px; background: #134528; border-radius: 18px; box-shadow: inset 0 0 0 10px #134528, inset 0 0 0 11.5px #c9a961, inset 0 0 0 16.5px #134528, inset 0 0 0 18px #c9a961; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 18px; box-sizing: border-box;">
      <div style="margin: 0 32px;">
        <div style="display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 16px 22px; border-top: 1px solid rgba(244, 239, 226, 0.38);">
          <span style="grid-column: 1 / -1; grid-row: 1; text-align: center; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 24px; font-weight: 600; color: #d9be78;">Sixth Year</span>
          <svg style="grid-column: 2; grid-row: 1;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d9be78" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 12 16 19 9"></polyline></svg>
        </div>
        <div style="display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 16px 22px; border-top: 1px solid rgba(244, 239, 226, 0.38);">
          <span style="grid-column: 1 / -1; grid-row: 1; text-align: center; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 24px; font-weight: 600; color: #d9be78;">Seventh Year</span>
          <svg style="grid-column: 2; grid-row: 1;" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d9be78" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 9 12 16 19 9"></polyline></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- DIVIDER A: gold khatim medallion, hairlines fading out to the edges -->
  <div style="display: flex; align-items: center; gap: 22px; margin: 72px 0;">
    <div style="flex: 1; height: 1.5px; background: linear-gradient(to right, rgba(19, 69, 40, 0) 0%, rgba(19, 69, 40, 0.85) 55%);"></div>
    <svg width="36" height="36" viewBox="0 0 34 34" fill="none" stroke="#c9a961" stroke-width="1.4" stroke-linejoin="round">
      <rect x="7.6" y="7.6" width="18.8" height="18.8"></rect>
      <polygon points="17,4 30,17 17,30 4,17"></polygon>
      <circle cx="17" cy="17" r="3.1"></circle>
    </svg>
    <div style="flex: 1; height: 1.5px; background: linear-gradient(to left, rgba(19, 69, 40, 0) 0%, rgba(19, 69, 40, 0.85) 55%);"></div>
  </div>

  <!-- head of the teachers section -->
  <h2 style="margin: 0 0 24px; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 41.6px; font-weight: 600; line-height: 1.15; color: #134528; text-align: center;">Our Teachers</h2>

  <div style="display: flex; gap: 20px; justify-content: center;">
    <article style="width: 313px; height: 240px; overflow: hidden;">
      <div style="width: 313px; height: 535px; background: #134528; box-shadow: inset 0 0 0 17px #134528, inset 0 0 0 18.5px #c9a961, inset 0 0 0 28.5px #134528, inset 0 0 0 30px #c9a961; padding: 49px 43px 0; box-sizing: border-box; text-align: center;">
        <p style="margin: 6px 0 14px; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 16.8px; font-style: italic; font-weight: 600; color: #d9be78;">Moulana</p>
        <h3 style="margin: 0; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 36.8px; font-style: italic; font-weight: 700; line-height: 1.12; color: #d9be78;">Kasim Ingar</h3>
        <hr style="width: 82%; margin: 30px auto 0; border: 0; border-top: 1.5px solid #d9be78;">
      </div>
    </article>
    <article style="width: 313px; height: 240px; overflow: hidden;">
      <div style="width: 313px; height: 535px; background: #134528; box-shadow: inset 0 0 0 17px #134528, inset 0 0 0 18.5px #c9a961, inset 0 0 0 28.5px #134528, inset 0 0 0 30px #c9a961; padding: 49px 43px 0; box-sizing: border-box; text-align: center;">
        <p style="margin: 6px 0 14px; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 16.8px; font-style: italic; font-weight: 600; color: #d9be78;">Moulana</p>
        <h3 style="margin: 0; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 36.8px; font-style: italic; font-weight: 700; line-height: 1.12; color: #d9be78;">Salim Chauhan</h3>
        <hr style="width: 82%; margin: 30px auto 0; border: 0; border-top: 1.5px solid #d9be78;">
      </div>
    </article>
    <article style="width: 313px; height: 240px; overflow: hidden;">
      <div style="width: 313px; height: 535px; background: #134528; box-shadow: inset 0 0 0 17px #134528, inset 0 0 0 18.5px #c9a961, inset 0 0 0 28.5px #134528, inset 0 0 0 30px #c9a961; padding: 49px 43px 0; box-sizing: border-box; text-align: center;">
        <p style="margin: 6px 0 14px; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 16.8px; font-style: italic; font-weight: 600; color: #d9be78;">Moulana</p>
        <h3 style="margin: 0; font-family: 'Cormorant Garamond', Garamond, serif; font-size: 36.8px; font-style: italic; font-weight: 700; line-height: 1.12; color: #d9be78;">Zuber Motala</h3>
        <hr style="width: 82%; margin: 30px auto 0; border: 0; border-top: 1.5px solid #d9be78;">
      </div>
    </article>
  </div>

</div>
</x-dc>
</body>
</html>
