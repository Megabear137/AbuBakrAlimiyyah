<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold Colour Themes</title>
  <link rel="icon" href="../../assets/img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #2a1d10; --muted: #5c4b3a; --brown: #6b4722; --gold-ink: #8f6a22; --ground: #faf8f3; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.6 "Instrument Sans", system-ui, sans-serif; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
    header { padding: 4rem 0 1rem; }
    .kicker { color: var(--gold-ink); font-size: .78rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: .4rem 0 0; color: var(--brown); font: 600 clamp(2.6rem, 2rem + 3vw, 4.2rem)/1 "Cormorant Garamond", serif; }
    h1 em { color: var(--gold-ink); font-weight: 500; }
    .lede { max-width: 700px; color: var(--muted); }
    .opt { padding: 3.5rem 0; border-top: 1px dashed rgba(92, 62, 30, .25); }
    .opt:first-of-type { border-top: 0; }
    .opt__head { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: flex-end; justify-content: space-between; margin-bottom: 1.5rem; }
    .opt__num { display: inline-grid; place-items: center; width: 46px; height: 46px; margin-right: .8rem; border-radius: 50%;
      background: linear-gradient(145deg, #e6cc88, #b8924a); color: #2a1a0b; font: 700 1.5rem "Cormorant Garamond", serif; vertical-align: middle; }
    h2 { display: inline; color: var(--brown); font: 600 2.1rem/1.1 "Cormorant Garamond", serif; vertical-align: middle; }
    .opt__desc { max-width: 720px; margin: .7rem 0 0; color: var(--muted); font-size: .95rem; }
    .swatches { display: flex; gap: 6px; }
    .swatches span { width: 44px; height: 44px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
    .open { display: inline-block; margin-top: .8rem; padding: .5rem 1.1rem; border-radius: 999px; background: linear-gradient(180deg, #e6c982, #c49a4a);
      color: #2a1a0b; font-weight: 600; font-size: .9rem; text-decoration: none; }
    .rounds a { margin-right: 1rem; color: var(--gold-ink); font-weight: 600; }
    .rounds a[aria-current="true"] { color: var(--ink); text-decoration: none; }
    .frame { position: relative; height: 780px; overflow: hidden; border-radius: 18px; background: #fff;
      box-shadow: 0 0 0 1px rgba(92,62,30,.15), 0 30px 60px -36px rgba(92,62,30,.5); }
    .frame iframe { position: absolute; top: 0; left: 0; width: 1440px; border: 0; transform-origin: 0 0; }
  </style>
</head>
<body>
  <header class="wrap">
    <p class="kicker" id="round-kicker"></p>
    <h1 id="round-title"></h1>
    <p class="lede" id="round-lede"></p>
    <p class="rounds" id="rounds"></p>
  </header>
  <main class="wrap" id="opts"></main>
  <script src="themes.js"></script>
  <script>
    var ROUNDS = {
      1: { title: "Gold, light brown <em>&amp; white</em>",
           lede: "Three palettes laid over the live page, with the same layout and content, so only the colour changes. Each preview is the real site at 1440px, scaled down; scroll inside it, or open it full size, where a switch at the bottom right flips between the round's themes and today's green." },
      2: { title: "Gold as the <em>lead colour</em>",
           lede: "Five kinds of gold, each taking the place green holds today: the Details cards, the teachers band, the featured article, the switch and the headings. Same layout and content, so only the colour changes. Each preview is the real site at 1440px, scaled down; scroll inside it, or open it full size, where a switch at the bottom right flips between the five and today's green." },
      3: { title: "Rust brown <em>&amp; gold</em>",
           lede: "Five pairings of the brown rgb(189, 93, 15) with a gold that suits it: pale butter, brass, champagne, bright gold against chocolate, and metallic leaf. Same layout and content, so only the colour changes. Each preview is the real site at 1440px, scaled down; scroll inside it, or open it full size, where a switch at the bottom right flips between the five and today's green." }
    };
    var round = Number(new URLSearchParams(location.search).get("round")) || 3;
    if (!ROUNDS[round]) round = 3;
    document.getElementById("round-kicker").textContent = "Colour themes · round " + round;
    document.getElementById("round-title").innerHTML = ROUNDS[round].title;
    document.getElementById("round-lede").textContent = ROUNDS[round].lede;
    document.getElementById("rounds").innerHTML = Object.keys(ROUNDS).map(function (r) {
      return '<a href="?round=' + r + '"' + (Number(r) === round ? ' aria-current="true"' : "") + '>Round ' + r + '</a>';
    }).join("");
    document.title = "Gold Colour Themes · Round " + round;

    var main = document.getElementById("opts");
    GOLD_THEMES.filter(function (t) { return t.round === round; }).forEach(function (t) {
      var s = document.createElement("section");
      s.className = "opt";
      s.innerHTML =
        '<div class="opt__head"><div><span class="opt__num">' + t.n + '</span><h2>' + t.name + '</h2>' +
        '<p class="opt__desc">' + t.desc + '</p><a class="open" href="view.html?t=' + t.n + '">Open full size →</a></div>' +
        '<div class="swatches">' + t.swatches.map(function (c) { return '<span style="background:' + c + '" title="' + c + '"></span>'; }).join("") + '</div></div>' +
        '<div class="frame"><iframe title="' + t.name + ' preview" loading="lazy"></iframe></div>';
      main.appendChild(s);
      themeFrame(s.querySelector("iframe"), t.n);
    });
    function fit() {
      document.querySelectorAll(".frame").forEach(function (f) {
        var k = f.clientWidth / 1440, ifr = f.querySelector("iframe");
        ifr.style.transform = "scale(" + k + ")";
        ifr.style.height = (f.clientHeight / k) + "px";
      });
    }
    addEventListener("resize", fit);
    fit();
  </script>
</body>
</html>
